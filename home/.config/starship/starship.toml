"$schema" = 'https://starship.rs/config-schema.json'

# Clean, single-line format with zero heavy background shapes
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$time\
$line_break$character\
"""

# Using our clean, universal palette definition
palette = 'theme_neutral'

[palettes.theme_neutral]
color_fg0  = '#6c7086' # Muted slate gray (for info text and symbols)
color_blue = '#89b4fa' # Soft accent color (for active directory)

[os]
disabled = false
style = "bold fg:color_blue"
format = " [$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"
Macos = "󰀵"

[username]
show_always = false # Set to true if you explicitly want your name visible

[directory]
style = "bold fg:color_blue"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
disabled = true
symbol = ""
style = "fg:color_fg0"
format = "on [$symbol $branch]($style)"

[git_status]
disabled = true
style = "fg:color_fg0"
format = "[[($all_status$ahead_behind)]($style) ]($style)"

# Universal programming language layout definition (Muted textual tags)
[kotlin]
symbol = " "
style = "fg:color_fg0"
format = "[$symbol($version )]($style)"

[java]
symbol = "☕ "
style = "fg:color_fg0"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "fg:color_fg0"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:color_fg0"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "fg:color_fg0"
format = "[$symbol($version )]($style)"

[cpp]
symbol = " "
style = "fg:color_fg0"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:color_fg0"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "fg:color_fg0"
format = "on [$symbol($context )]($style)"

[time]
disabled = true # Disabling to keep the interactive prompt perfectly concise

[line_break]
disabled = false

[character]
disabled = false
success_symbol = ' [>](bold fg:white)'
error_symbol = ' [>](bold fg:red)'
vimcmd_symbol = ' [<](bold fg:green)'
vimcmd_replace_one_symbol = ' [<](bold fg:purple)'
vimcmd_replace_symbol = ' [<](bold fg:purple)'
vimcmd_visual_symbol = ' [<](bold fg:yellow)'
